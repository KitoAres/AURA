<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GACIP - Liderazgo Transformacional</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- LOGIN -->
  <div id="login-view" class="view active">
    <div class="glass-card login-card">
      <div class="logo-gacip">🛡️ GACIP</div>
      <h2>Portal de Entrenamiento</h2>
      
      <div id="login-error" class="alert" style="display: none;">Credenciales incorrectas</div>
      
      <form id="login-form">
        <div class="input-group">
          <label>ID / Número de Usuario</label>
          <input type="text" id="login-id" placeholder="Ej. 1, 2, admin1 o sudo" required autocomplete="off">
        </div>
        <div class="input-group">
          <label>Contraseña</label>
          <input type="password" id="login-pass" placeholder="Por defecto: 123" required>
        </div>
        <button type="submit" class="btn-glow">Iniciar Sesión</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-view" class="view">
    <nav class="sidebar">
      <div class="user-profile">
        <div class="avatar" id="nav-avatar">👤</div>
        <div class="user-info-text">
          <h3 id="nav-name">Nombre</h3>
          <span id="nav-role" class="badge">Rol</span>
        </div>
      </div>
      <ul class="nav-links" id="nav-links"></ul>
      <button id="btn-logout" class="btn-outline" style="margin-top: 1rem;">Cerrar Sesión</button>
    </nav>

    <main class="content" id="main-content"></main>
  </div>

  <!-- MODAL DE EDICIÓN (SOLO SUDO) -->
  <div id="edit-modal" class="modal hidden">
    <div class="glass-card modal-content">
      <h3 style="margin-bottom: 1rem; color: var(--primary);">Editar Usuario</h3>
      <input type="hidden" id="edit-id">
      <div class="input-group">
        <label>Nombre</label>
        <input type="text" id="edit-name">
      </div>
      <div class="input-group">
        <label>Contraseña</label>
        <input type="text" id="edit-pass">
      </div>
      <div class="input-group">
        <label>Rol</label>
        <select id="edit-role">
          <option value="user">Cadete (Usuario)</option>
          <option value="admin">Instructor (Admin)</option>
        </select>
      </div>
      <div class="grid-2">
        <button onclick="closeEditModal()" class="btn-outline">Cancelar</button>
        <button onclick="saveUserEdit()" class="btn-glow">Guardar</button>
      </div>
    </div>
  </div>

  <div id="toast">Notificación</div>

  <script src="app.js"></script>
</body>
</html>

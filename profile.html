<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GACIP | Perfiles de Liderazgo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">GACIP Admin</div>
        <div class="links">
            <a href="dashboard.html">Escáner QR</a>
            <a href="profile.html">Perfiles de Liderazgo</a>
            <button id="logoutBtn" class="btn outline" onclick="localStorage.clear(); window.location.href='index.html'">Salir</button>
        </div>
    </nav>
    <main class="dashboard-container">
        <h2>Perfiles Psicológicos y de Liderazgo</h2>
        <div id="profiles-container" style="margin-top: 2rem; display: grid; gap: 1.5rem;">
            <p>Cargando perfiles...</p>
        </div>
    </main>

    <!-- MODAL DE EDICIÓN (Oculto por defecto) -->
    <div id="editModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; padding: 1rem; z-index: 1000;">
        <div class="card" style="width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; text-align: left;">
            <h3 style="margin-bottom: 1rem;">Editar Perfil</h3>
            <form id="editProfileForm">
                <input type="hidden" id="edit-id">
                
                <div class="input-group">
                    <label>Influencia Idealizada (0-100)</label>
                    <input type="number" id="edit-ii" min="0" max="100">
                </div>
                <div class="input-group">
                    <label>Consideración Individualizada (0-100)</label>
                    <input type="number" id="edit-ci" min="0" max="100">
                </div>
                <div class="input-group">
                    <label>Motivación Inspiracional (0-100)</label>
                    <input type="number" id="edit-mi" min="0" max="100">
                </div>
                <div class="input-group">
                    <label>Estimulación Intelectual (0-100)</label>
                    <input type="number" id="edit-ei" min="0" max="100">
                </div>
                <div class="input-group">
                    <label>Fortalezas</label>
                    <input type="text" id="edit-f">
                </div>
                <div class="input-group">
                    <label>Áreas Débiles</label>
                    <input type="text" id="edit-ad">
                </div>
                <div class="input-group">
                    <label>Mejoras</label>
                    <input type="text" id="edit-m">
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn primary">Guardar</button>
                    <button type="button" class="btn" style="background: #e2e8f0; color: #333;" onclick="document.getElementById('editModal').style.display='none'">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
